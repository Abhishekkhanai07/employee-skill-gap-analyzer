services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yottaflex
      POSTGRES_USER: yottaflex
      POSTGRES_PASSWORD: yottaflex_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yottaflex -d yottaflex"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - yottaflex_postgres_data:/var/lib/postgresql/data

volumes:
  yottaflex_postgres_data:
